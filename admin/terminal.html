<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Terminal · BlockAudit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔐%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/core.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/admin-terminal.js" defer></script>
</head>
<body data-root="../" data-guard>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Terminal</h1>
        <p>The backend log: logins, signatures, consensus votes, mining and security events, newest at the bottom.</p>
      </div>
    </div>

    <div class="cx-toolbar tm-toolbar">
      <div class="field">
        <label for="tm-level">Show</label>
        <select class="input" id="tm-level">
          <option value="all">All levels</option>
          <option value="info">Info</option>
          <option value="success">Success</option>
          <option value="warn">Warnings</option>
          <option value="error">Errors and security</option>
        </select>
      </div>
      <div class="field">
        <label for="tm-search">Search</label>
        <input class="input" id="tm-search" type="search" maxlength="40" autocomplete="off" placeholder="e.g. Rohan or SECURITY">
      </div>
      <label class="tm-follow"><input type="checkbox" id="tm-follow" checked> Follow new lines</label>
    </div>

    <p class="muted cx-count" id="tm-count"></p>
    <div class="terminal" id="terminal" role="log" aria-live="polite" tabindex="0"></div>
  </main>
</body>
</html>
