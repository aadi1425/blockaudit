<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Consensus logs · BlockAudit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔐%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/core.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/admin-consensus.js" defer></script>
</head>
<body data-root="../" data-guard>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Consensus logs</h1>
        <p>Every access request and how the 3 nodes voted. Node 1 and Node 2 follow the access list. Node 3 votes at random 20% of the time. 2 of 3 YES votes approve a request.</p>
      </div>
    </div>

    <div class="stats stats-4">
      <div class="stat"><div class="stat-value" id="cs-rounds">0</div><div class="stat-label">Consensus rounds</div></div>
      <div class="stat stat-green"><div class="stat-value" id="cs-approved">0</div><div class="stat-label">Approved</div></div>
      <div class="stat"><div class="stat-value" id="cs-faults">0</div><div class="stat-label">Node 3 random votes</div></div>
      <div class="stat"><div class="stat-value" id="cs-outvoted">0</div><div class="stat-label">Wrong votes outvoted</div></div>
    </div>

    <div class="cx-summary" id="cs-summary" role="status"></div>

    <section class="section" aria-labelledby="cs-h">
      <div class="section-head"><h2 id="cs-h">Rounds</h2><span class="muted" id="cs-count"></span></div>
      <div class="table-wrap" id="cs-table"></div>
    </section>
  </main>
</body>
</html>
