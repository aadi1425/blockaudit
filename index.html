<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · BlockAudit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔐%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</head>
<body data-root="">
  <main class="login">
    <div class="login-inner">
      <div class="login-brand">
        <h1>🔐 BlockAudit</h1>
        <p>Enterprise Identity &amp; Access Management</p>
      </div>

      <form class="card" id="login-form" novalidate autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" type="text" maxlength="24" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="btn btn-block" id="login-btn" type="submit">Sign in</button>
        <p class="secure-note">Every sign-in attempt is recorded on the audit chain.</p>
      </form>

      <details class="demo">
        <summary>Demo accounts for evaluators</summary>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Username</th><th>Password</th><th>Role</th></tr></thead>
            <tbody>
              <tr><td>Arjun</td><td>arjun@99</td><td>User</td></tr>
              <tr><td>Kavya</td><td>kavya@99</td><td>User</td></tr>
              <tr><td>Rohan</td><td>rohan@99</td><td>User</td></tr>
              <tr><td>Aadi</td><td>admin@999</td><td>Admin</td></tr>
            </tbody>
          </table>
        </div>
      </details>
    </div>
  </main>
</body>
</html>
