<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Public ledger · BlockAudit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔐%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/core.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/user-ledger.js" defer></script>
</head>
<body data-root="../" data-guard>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Public ledger</h1>
        <p>Every block on the chain. Anyone can verify it; only your own records show names.</p>
      </div>
      <button class="btn" type="button" id="verify">Verify chain</button>
    </div>

    <div class="stats stats-4">
      <div class="stat"><div class="stat-value" id="lg-blocks">0</div><div class="stat-label">Blocks</div></div>
      <div class="stat"><div class="stat-value" id="lg-mine">0</div><div class="stat-label">Your blocks</div></div>
      <div class="stat" id="lg-status-box"><div class="stat-value" id="lg-status">…</div><div class="stat-label">Your check</div></div>
      <div class="stat"><div class="stat-value" id="lg-checked">—</div><div class="stat-label">Last verified</div></div>
    </div>

    <div class="cx-summary" id="lg-summary" role="status" aria-live="polite"></div>

    <div class="cx-toolbar lg-toolbar">
      <div class="field">
        <label for="lg-filter">Show</label>
        <select class="input" id="lg-filter">
          <option value="all">All blocks</option>
          <option value="mine">My blocks only</option>
          <option value="bad">Tampered only</option>
        </select>
      </div>
      <div class="field">
        <label for="lg-order">Order</label>
        <select class="input" id="lg-order">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first (genesis on top)</option>
        </select>
      </div>
    </div>

    <p class="muted cx-count" id="lg-count"></p>
    <div class="cx-list" id="lg-list"></div>
  </main>
</body>
</html>
